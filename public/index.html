<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D. Ramos Enterprises Payroll</title>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green-dark: #2d3f2f;
  --green-mid:  #4a6b4d;
  --green-light: #6b8f6e;
  --green-pale: #e8f0e8;
  --white: #ffffff;
  --gray-bg: #ffffff;
  --gray-border: #d0d8d0;
  --gray-text: #555f55;
  --red: #c0392b;
}

body {
  font-family: Georgia, 'Times New Roman', serif;
  background: #ffffff;
  color: #1a1a1a;
  min-height: 100vh;
}

/* ─── PIN SCREEN ─── */
#pin-screen {
  position: fixed;
  inset: 0;
  background: var(--green-dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 500;
  transition: opacity .4s, transform .4s;
}
#pin-screen.hidden {
  opacity: 0;
  transform: scale(1.03);
  pointer-events: none;
}

.pin-logo {
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: 4px;
  color: #a8c8aa;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.pin-sub {
  font-family: Georgia, serif;
  font-size: 26px;
  color: #ffffff;
  margin-bottom: 48px;
  font-weight: normal;
}

.pin-label {
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  color: #a8c8aa;
  text-transform: uppercase;
  margin-bottom: 18px;
}

.pin-dots {
  display: flex;
  gap: 14px;
  margin-bottom: 32px;
}
.pin-dot {
  width: 13px; height: 13px;
  border-radius: 50%;
  border: 2px solid #4a6b4d;
  transition: all .2s;
}
.pin-dot.filled { background: #a8c8aa; border-color: #a8c8aa; }

.pin-keypad {
  display: grid;
  grid-template-columns: repeat(3, 68px);
  gap: 8px;
  margin-bottom: 12px;
}
.pin-key {
  width: 68px; height: 68px;
  border-radius: 8px;
  border: 1px solid #3d5c40;
  background: #253727;
  color: #ffffff;
  font-family: Arial, sans-serif;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  transition: all .12s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pin-key:hover { background: #3a5a3d; }
.pin-key:active { transform: scale(.93); background: var(--green-mid); }
.pin-key.del { font-size: 16px; color: #a8c8aa; }
.pin-key.empty { background: transparent; border: none; cursor: default; }

.pin-error {
  font-size: 13px;
  color: #ff9999;
  font-family: Arial, sans-serif;
  height: 20px;
  text-align: center;
  margin-top: 10px;
}

/* ─── MAIN APP ─── */
#app { display: none; min-height: 100vh; }
#app.visible { display: block; }
#att-date:focus { border-color: var(--green-mid); outline: 2px solid #c8ddc8; }

header {
  background: var(--green-dark);
  padding: 0 32px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.h-logo {
  font-family: Georgia, serif;
  font-size: 16px;
  color: #ffffff;
  letter-spacing: 1px;
}
.h-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.h-role {
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: #a8c8aa;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn-lock {
  background: none;
  border: 1px solid #4a6b4d;
  border-radius: 5px;
  color: #a8c8aa;
  font-size: 13px;
  padding: 6px 14px;
  cursor: pointer;
  font-family: Arial, sans-serif;
  transition: all .2s;
}
.btn-lock:hover { background: #3a5a3d; color: #fff; }

/* ─── VIEW SWITCHER ─── */
.view-strip {
  background: var(--white);
  border-bottom: 2px solid var(--gray-border);
  display: flex;
  padding: 0 32px;
}
.view-tab {
  padding: 14px 24px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  font-weight: bold;
  color: var(--gray-text);
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all .15s;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.view-tab.active { color: var(--green-dark); border-bottom-color: var(--green-dark); }
.view-tab:hover:not(.active) { color: var(--green-dark); }

/* ─── CONTENT ─── */
main { max-width: 900px; margin: 0 auto; padding: 36px 24px; }

.page { display: none; }
.page.active { display: block; }

.pg-eyebrow { display: none; }
.pg-title {
  font-family: Georgia, serif;
  font-size: 26px;
  font-weight: normal;
  margin-bottom: 24px;
  color: var(--green-dark);
  border-bottom: 1px solid var(--gray-border);
  padding-bottom: 12px;
}
.pg-title em { font-style: normal; }

/* ─── SUBMIT FORM ─── */
.form-card {
  background: var(--white);
  border: 1px solid var(--gray-border);
  border-radius: 6px;
  padding: 28px;
}

.field { margin-bottom: 20px; }
.field label {
  display: block;
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gray-text);
  margin-bottom: 8px;
}

.date-display {
  font-family: Georgia, serif;
  font-size: 22px;
  color: var(--green-dark);
}
.date-sub {
  font-size: 13px;
  color: var(--gray-text);
  font-family: Arial, sans-serif;
  margin-top: 2px;
}

.field input[type=text] {
  width: 100%;
  border: 1px solid var(--gray-border);
  border-radius: 5px;
  background: var(--white);
  padding: 11px 13px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: #1a1a1a;
  outline: none;
  transition: border-color .2s;
}
.field input[type=text]:focus { border-color: var(--green-mid); outline: 2px solid #c8ddc8; }
.field input[type=text]::placeholder { color: #aaa; }

/* ─── EMPLOYEE MULTI-SELECT ─── */
.emp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}

.emp-tile {
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all .18s;
  background: var(--paper);
  display: flex;
  align-items: center;
  gap: 10px;
  user-select: none;
}
.emp-tile:hover { border-color: var(--gold-light); background: #fdf8ee; }
.emp-tile.on { border-color: var(--gold); background: #fdf8ee; box-shadow: 0 0 0 3px #b8973a22; }

/* ─── EMPLOYEE TILES ─── */
.emp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 8px;
}
.emp-tile {
  border: 1px solid var(--gray-border);
  border-radius: 5px;
  padding: 11px 13px;
  cursor: pointer;
  transition: all .15s;
  background: #f5f8f5;
  display: flex;
  align-items: center;
  gap: 9px;
  user-select: none;
}
.emp-tile:hover { border-color: var(--green-mid); background: var(--green-pale); }
.emp-tile.on { border-color: var(--green-dark); background: var(--green-pale); }

.tile-check {
  width: 17px; height: 17px;
  border-radius: 3px;
  border: 2px solid var(--gray-border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all .15s;
  font-size: 11px;
  color: transparent;
  font-weight: bold;
}
.emp-tile.on .tile-check { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
.tile-name { font-size: 14px; font-family: Arial, sans-serif; line-height: 1.2; }

.select-all-row {
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
  align-items: center;
}
.link-btn {
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: var(--green-mid);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
}
.link-btn:hover { color: var(--green-dark); }
.divider { width: 1px; height: 14px; background: var(--gray-border); }

.submit-btn {
  margin-top: 24px;
  width: 100%;
  padding: 15px;
  background: var(--green-dark);
  color: #ffffff;
  border: none;
  border-radius: 5px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.submit-btn:hover { background: var(--green-mid); }

/* ─── VIEW PAGE ─── */
.filter-row {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-row select {
  border: 1px solid var(--gray-border);
  border-radius: 4px;
  background: var(--white);
  padding: 9px 12px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: #1a1a1a;
  outline: none;
  cursor: pointer;
}

.worker-card {
  background: var(--white);
  border: 1px solid var(--gray-border);
  border-radius: 6px;
  margin-bottom: 12px;
  overflow: hidden;
}

.wc-header {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--gray-border);
  background: var(--green-pale);
}
.wc-name {
  font-family: Georgia, serif;
  font-size: 18px;
  color: var(--green-dark);
}
.wc-days-count {
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: var(--gray-text);
}
.wc-wage {
  font-family: Arial, sans-serif;
  font-size: 13px;
  font-weight: bold;
  color: var(--green-dark);
}
.dl-btn {
  padding: 9px 16px;
  border-radius: 4px;
  border: none;
  background: var(--green-dark);
  color: #ffffff;
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: background .2s;
  white-space: nowrap;
}
.dl-btn:hover { background: var(--green-mid); }

.wc-days {
  padding: 14px 20px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.day-chip {
  background: var(--gray-bg);
  border: 1px solid var(--gray-border);
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 13px;
  font-family: Arial, sans-serif;
  color: #1a1a1a;
  display: flex;
  align-items: center;
  gap: 5px;
}
.day-chip .loc { font-size: 12px; color: var(--gray-text); }

.empty-state { text-align: center; padding: 60px 0; }
.empty-state .big { font-family: Georgia, serif; font-size: 20px; color: var(--gray-text); margin-bottom: 6px; }
.empty-state p { font-size: 13px; font-family: Arial, sans-serif; color: #aaa; }

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--green-dark);
  color: #fff;
  border-radius: 5px;
  padding: 13px 20px;
  font-size: 13px;
  font-family: Arial, sans-serif;
  z-index: 900;
  transform: translateY(60px);
  opacity: 0;
  transition: all .25s ease;
  max-width: 280px;
}
.toast.show { transform: none; opacity: 1; }

/* ─── MANAGE WORKERS ─── */
.mw-row {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--gray-border);
}
.mw-row:last-child { border-bottom: none; }
.mw-row input {
  flex: 1;
  border: 1px solid var(--gray-border);
  border-radius: 4px;
  background: var(--gray-bg);
  padding: 9px 12px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: #1a1a1a;
  outline: none;
}
.mw-row input:focus { border-color: var(--green-mid); }
.mw-name-static { flex: 1; font-size: 15px; font-family: Arial, sans-serif; }
.mw-wage-static { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; color: var(--green-dark); width: 90px; }
.btn-sm {
  padding: 8px 14px;
  border-radius: 4px;
  border: 1px solid var(--gray-border);
  background: var(--white);
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: all .15s;
  color: #1a1a1a;
  white-space: nowrap;
}
.btn-sm:hover { background: var(--green-dark); color: #fff; border-color: var(--green-dark); }
.btn-sm.danger:hover { background: var(--red); border-color: var(--red); }

.add-worker-form {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
  padding-top: 20px;
  border-top: 1px solid var(--gray-border);
}
.add-worker-form input {
  flex: 1;
  min-width: 140px;
  border: 1px solid var(--gray-border);
  border-radius: 4px;
  background: var(--white);
  padding: 11px 13px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: #1a1a1a;
  outline: none;
}
.add-worker-form input:focus { border-color: var(--green-mid); }

@media (max-width: 640px) {
  header {
    padding: 0 16px;
  }

  .h-logo {
    font-size: 14px;
  }

  .h-right {
    gap: 8px;
  }

  .h-role {
    font-size: 10px;
  }

  .btn-lock {
    padding: 5px 10px;
    font-size: 12px;
  }

  .view-strip {
    padding: 0 8px;
    overflow-x: auto;
    white-space: nowrap;
  }

  .view-tab {
    padding: 13px 14px;
    font-size: 11px;
    flex-shrink: 0;
  }

  main {
    padding: 20px 12px;
    max-width: 100%;
    overflow-x: hidden;
  }

  .form-card {
    padding: 16px;
    width: 100%;
    overflow-x: hidden;
  }

  .filter-row {
    flex-direction: column;
    align-items: stretch;
  }

  .filter-row select {
    width: 100%;
  }

  #hourly-form-card > div:nth-child(2) {
    display: grid !important;
    grid-template-columns: 1fr !important;
    gap: 12px !important;
  }

  #hourly-form-card select,
  #hourly-form-card input,
  #hourly-form-card button {
    width: 100% !important;
  }

  .worker-card {
    width: 100%;
  }

  .wc-header {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 14px 16px;
  }

  .wc-name {
    font-size: 17px;
  }

  .wc-days-count,
  .wc-wage {
    display: block;
    font-size: 12px;
  }

  .dl-btn {
    width: 100%;
    padding: 10px;
  }

  .wc-days {
    padding: 12px 14px;
    display: block;
  }

  .day-chip {
    width: 100%;
    display: block;
    margin-bottom: 8px;
    line-height: 1.5;
    word-break: break-word;
  }

  .day-chip .loc {
    display: block;
    margin-top: 2px;
  }

  .mw-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    align-items: stretch;
  }

  .mw-name-static,
  .mw-wage-static {
    width: 100%;
  }

  .mw-row input {
    max-width: none !important;
    width: 100%;
  }

  .mw-row .btn-sm {
    width: 100%;
  }

  .add-worker-form {
    display: grid;
    grid-template-columns: 1fr;
  }

  .add-worker-form input,
  .add-worker-form button {
    width: 100%;
  }


}

/* ─── ALREADY-LOGGED BANNER ─── */
.existing-banner {
  display: none;
  background: var(--green-pale);
  border: 1px solid var(--green-light);
  border-left: 4px solid var(--green-dark);
  border-radius: 5px;
  padding: 12px 14px;
  margin-bottom: 18px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: var(--green-dark);
  line-height: 1.5;
}
.existing-banner.show { display: block; }
.existing-banner .eb-names {
  display: block;
  margin-top: 4px;
  color: var(--gray-text);
  font-size: 12px;
}

/* ─── REVIEW DIALOG ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 30, 21, .55);
  z-index: 800;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }

.modal {
  background: var(--white);
  border-radius: 6px;
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .3);
}
.modal-head {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--gray-border);
}
.modal-title {
  font-family: Georgia, serif;
  font-size: 21px;
  color: var(--green-dark);
  margin-bottom: 4px;
}
/* The day being logged, spelled out — the one fact worth re-reading */
.modal-date {
  font-family: Georgia, serif;
  font-size: 17px;
  color: #1a1a1a;
  margin: 6px 0 3px;
}
.modal-sub {
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: var(--gray-text);
}
.modal-body {
  padding: 8px 24px;
  overflow-y: auto;
  flex: 1;
}
.modal-foot {
  padding: 16px 24px 20px;
  border-top: 1px solid var(--gray-border);
  display: flex;
  gap: 10px;
  align-items: center;
}

/* One worker awaiting a full-day / half-day call */
.rw-row {
  padding: 16px 0;
  border-bottom: 1px solid var(--gray-border);
}
.rw-row:last-child { border-bottom: none; }

.rw-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.rw-name {
  font-family: Georgia, serif;
  font-size: 16px;
  color: #1a1a1a;
  flex: 1;
}
.rw-pay {
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  color: var(--green-dark);
  white-space: nowrap;
}

.daytype {
  display: flex;
  border: 1px solid var(--gray-border);
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 8px;
}
.daytype button {
  flex: 1;
  border: none;
  background: var(--white);
  padding: 11px 8px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: var(--gray-text);
  cursor: pointer;
  transition: background .15s, color .15s;
}
.daytype button + button { border-left: 1px solid var(--gray-border); }
.daytype button:hover { background: var(--green-pale); }
.daytype button.on {
  background: var(--green-dark);
  color: #fff;
  font-weight: bold;
}

.rw-note {
  width: 100%;
  border: 1px solid var(--gray-border);
  border-radius: 4px;
  padding: 9px 11px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: #1a1a1a;
  outline: none;
  background: var(--white);
}
.rw-note:focus { border-color: var(--green-mid); outline: 2px solid #c8ddc8; }
.rw-note::placeholder { color: #aaa; }

.modal-total {
  flex: 1;
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: var(--gray-text);
}
.modal-total strong {
  display: block;
  font-family: Georgia, serif;
  font-size: 19px;
  color: var(--green-dark);
}

.btn-back {
  background: var(--white);
  border: 1px solid var(--gray-border);
  border-radius: 5px;
  padding: 12px 18px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: var(--gray-text);
  cursor: pointer;
}
.btn-back:hover { border-color: var(--green-mid); color: var(--green-dark); }

.btn-confirm {
  background: var(--green-dark);
  border: 1px solid var(--green-dark);
  border-radius: 5px;
  padding: 12px 22px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  color: #fff;
  cursor: pointer;
}
.btn-confirm:hover { background: var(--green-mid); }
.btn-confirm:disabled { opacity: .6; cursor: default; }

/* Half days need to be obvious at a glance on the records page */
.half-badge {
  display: inline-block;
  background: var(--green-pale);
  border: 1px solid var(--green-light);
  border-radius: 3px;
  padding: 1px 6px;
  font-size: 11px;
  font-family: Arial, sans-serif;
  color: var(--green-dark);
  margin-left: 4px;
}

@media (max-width: 640px) {

}

          <div>

            <input type="time" id="hourly-time-out" style="width:100%;border:1px solid var(--gray-border);border-radius:4px;background:var(--white);padding:10px 12px;font-family:Arial,sans-serif;font-size:14px;color:#1a1a1a;outline:none;">

<!-- ═══ REVIEW DIALOG — half days, per-worker comments, and a last look ═══ -->
<div class="modal-overlay" id="review-overlay">

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const API = ''; // empty = same origin (server.js serves this file)

const PINS = {
  '0523': { role: 'Boss',   canSubmit: true,  canView: true,  canManage: true  },
  '2004': { role: 'Viewer', canSubmit: false, canView: true,  canManage: false },
};

let workers     = [];
let records     = [];
let currentUser = null;

// ═══════════════════════════════════════
// API HELPERS
// ═══════════════════════════════════════
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}
const GET    = path          => api('GET',    path);
const POST   = (path, body)  => api('POST',   path, body);
const PATCH  = (path, body)  => api('PATCH',  path, body);
const DELETE = path          => api('DELETE', path);

// ═══════════════════════════════════════
// PIN
// ═══════════════════════════════════════
let pinBuffer = '';

function pinPress(d) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += d;
  updateDots();
  if (pinBuffer.length === 4) setTimeout(checkPin, 120);
}
function pinDel() {
  pinBuffer = pinBuffer.slice(0, -1);
  updateDots();
  document.getElementById('pin-error').textContent = '';
}
function updateDots() {
  for (let i = 0; i < 4; i++)
    document.getElementById('d' + i).classList.toggle('filled', i < pinBuffer.length);
}
async function checkPin() {
  const user = PINS[pinBuffer];
  if (user) {
    currentUser = { ...user };
    document.getElementById('pin-screen').classList.add('hidden');
    document.getElementById('app').classList.add('visible');
    await initApp();
  } else {
    document.getElementById('pin-error').textContent = 'Incorrect PIN';
    pinBuffer = ''; updateDots();
    const ps = document.getElementById('pin-screen');
    ps.style.animation = 'none'; ps.offsetHeight;
    ps.style.animation = 'shake .4s ease';
  }
}
function lockApp() {
  pinBuffer = ''; updateDots();
  currentUser = null;
  document.getElementById('pin-error').textContent = '';
  document.getElementById('app').classList.remove('visible');
  document.getElementById('pin-screen').classList.remove('hidden');
}

const style = document.createElement('style');
style.textContent = `@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
}`;
document.head.appendChild(style);

// ═══════════════════════════════════════
// APP INIT
// ═══════════════════════════════════════
async function initApp() {
  document.getElementById('h-role-label').textContent = currentUser.role;
  document.getElementById('tab-submit').style.display  = currentUser.canSubmit  ? '' : 'none';
  document.getElementById('tab-workers').style.display = currentUser.canManage  ? '' : 'none';

  setTodayDisplay();

  try {
    [workers, records, hourlyEntries] = await Promise.all([
      GET('/api/workers'),
      GET('/api/records'),
      GET('/api/hourly'),
    ]);
  } catch (e) {
    toast('Could not connect to server: ' + e.message);
    workers = []; records = []; hourlyEntries = [];
  }

  buildEmpGrid();
  populateFilters();
  renderView();
  renderWorkerList();

  // Typing a job site that already has a crew logged should say so immediately.
  const locInput = document.getElementById('att-location');
  locInput.oninput = refreshExistingBanner;
  refreshExistingBanner();

  if (!currentUser.canSubmit && currentUser.canView) switchTab('view');
  else switchTab('submit');
}

// ═══════════════════════════════════════
// DATE HELPERS
// ═══════════════════════════════════════
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function setTodayDisplay() {
  const input = document.getElementById('att-date');
  const sub = document.getElementById('today-sub');

  const today = todayStr();
  input.value = today;

  // Stops the date picker from even offering a future day. The check in
  // openReview() still runs, because typed dates can slip past `max`.
  input.max = today;

  const hourlyDate = document.getElementById('hourly-date');
  if (hourlyDate) hourlyDate.max = today;

  sub.textContent = DAY_NAMES[new Date(today + 'T12:00:00').getDay()];

  input.onchange = () => {
    if (!input.value) input.value = todayStr();

    if (input.value > todayStr()) {
      toast("That day hasn't happened yet — pick today or a day already past.");
      input.value = todayStr();
    }

    sub.textContent = DAY_NAMES[new Date(input.value + 'T12:00:00').getDay()];
    refreshExistingBanner();
  };
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Months spelled out. "8/30" invites a misread; "August 30, 2026" doesn't.
function formatDateLong(ds) {
  const [y, m, d] = ds.split('-');
  const months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  return `${months[+m - 1]} ${+d}, ${y}`;
}
function formatDate(ds) {
  const [y,m,d] = ds.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[+m-1]} ${+d}, ${y}`;
}

// ═══════════════════════════════════════
// PAY PERIOD HELPERS  (Wed–Tue)
// ═══════════════════════════════════════
function parseLocalDate(ds) { return new Date(ds + 'T12:00:00'); }
function toYMD(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function addDays(date, days) {
  const copy = new Date(date);
  copy.setDate(copy.getDate() + days);
  return copy;
}
function getPayPeriod(ds) {
  const d = parseLocalDate(ds);
  const day = d.getDay(); // Sun=0 Mon=1 Tue=2 Wed=3
  const daysSinceWednesday = (day - 3 + 7) % 7;
  const start = addDays(d, -daysSinceWednesday);
  const end   = addDays(start, 6);
  return { start: toYMD(start), end: toYMD(end), key: `${toYMD(start)}|${toYMD(end)}` };
}
function payPeriodLabel(key) {
  const [start, end] = key.split('|');
  return `${formatDate(start)} – ${formatDate(end)}`;
}
function recordInPeriod(record, periodKey) {
  if (!periodKey) return true;
  const [start, end] = periodKey.split('|');
  return record.date >= start && record.date <= end;
}

// ═══════════════════════════════════════
// TABS
// ═══════════════════════════════════════
function switchTab(t) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + t).classList.add('active');
  const tab = document.getElementById('tab-' + t);
  if (tab) tab.classList.add('active');
  if (t === 'view')    { populateFilters(); renderView(); }
  if (t === 'workers') renderWorkerList();
}

// ═══════════════════════════════════════
// SUBMIT PAGE
// ═══════════════════════════════════════
let selected = new Set();

function buildEmpGrid() {
  const g = document.getElementById('emp-grid');
  g.innerHTML = '';

  workers
    .filter(w => w.showOnAttendance !== false)
    .forEach(w => {
      const div = document.createElement('div');
      div.className = 'emp-tile' + (selected.has(w._id) ? ' on' : '');
      div.dataset.id = w._id;
      div.innerHTML = `<div class="tile-check">✓</div><div class="tile-name">${esc(w.name)}</div>`;
      div.onclick = () => toggleEmp(w._id, div);
      g.appendChild(div);
    });

  updateSubmitButton();
}
function toggleEmp(id, el) {
  if (selected.has(id)) { selected.delete(id); el.classList.remove('on'); }
  else { selected.add(id); el.classList.add('on'); }
  updateSubmitButton();
}
function selectAll() {
  workers
    .filter(w => w.showOnAttendance !== false)
    .forEach(w => selected.add(w._id));

  buildEmpGrid();
}
function selectNone() { selected.clear(); buildEmpGrid(); }

// Says out loud how many people are about to be logged, so nobody has to count
// highlighted tiles to check themselves.
function updateSubmitButton() {
  const btn = document.getElementById('submit-attendance-btn');
  if (!btn) return;

  const n = selected.size;
  btn.innerHTML = n === 0
    ? '<span>✓</span> Next: Check Hours &amp; Submit'
    : `<span>✓</span> Next: Check Hours for ${n} ${n === 1 ? 'Person' : 'People'}`;
}

function workerName(id) {
  const w = workers.find(x => x._id === id);
  return w ? w.name : 'Unknown worker';
}

function money(n) {
  return '$' + Number(n || 0).toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

// Names, job sites and comments are typed by hand and land in innerHTML. An
// apostrophe in "Bob's Fence" or a stray < would otherwise mangle the page.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// The record already on file for whatever date + job site is currently typed in.
function findExistingRecord() {
  const date = document.getElementById('att-date').value || todayStr();
  const loc  = document.getElementById('att-location').value.trim();
  if (!loc) return null;
  return records.find(r => r.date === date && r.location === loc) || null;
}

// Tells the user, before they submit, that this day already has people on it —
// so "I'm adding Dave" never feels like it might be replacing the crew.
function refreshExistingBanner() {
  const banner = document.getElementById('existing-banner');
  const existing = findExistingRecord();

  if (!existing || !existing.workerIds.length) {
    banner.classList.remove('show');
    banner.innerHTML = '';
    return;
  }

  const names = existing.workerIds.map(workerName).join(', ');
  const count = existing.workerIds.length;

  banner.innerHTML =
    `<strong>${count} ${count === 1 ? 'person' : 'people'}</strong> already logged at ` +
    `<strong>${esc(existing.location)}</strong> on ${formatDateLong(existing.date)}.` +
    `<span class="eb-names">${names}</span>`;
  banner.classList.add('show');
}

// ═══════════════════════════════════════
// REVIEW DIALOG — half days & comments
// ═══════════════════════════════════════
// workerId -> { halfDay, note } for the crew currently being submitted.
let reviewDetails = new Map();

function openReview() {
  const loc  = document.getElementById('att-location').value.trim();
  const date = document.getElementById('att-date').value || todayStr();

  if (!loc) return toast('Please enter a job site / location.');
  if (selected.size === 0) return toast('Please select at least one employee.');

  if (date > todayStr()) {
    return toast("You can't log work for a day that hasn't happened yet.");
  }

  // Carry over what's already saved for these workers, so reopening the day
  // shows their existing half-day and comment instead of silently resetting.
  const existing = findExistingRecord();
  reviewDetails = new Map();

  selected.forEach(id => {
    const saved = existing && (existing.entries || []).find(e => String(e.workerId) === String(id));
    reviewDetails.set(id, {
      halfDay: saved ? Boolean(saved.halfDay) : false,
      note: saved ? (saved.note || '') : ''
    });
  });

  const dayName = DAY_NAMES[new Date(date + 'T12:00:00').getDay()];
  document.getElementById('review-date').textContent =
    `${dayName}, ${formatDateLong(date)}`;
  document.getElementById('review-sub').textContent =
    `${loc} · ${selected.size} ${selected.size === 1 ? 'person' : 'people'}`;

  renderReviewRows();
  document.getElementById('review-overlay').classList.add('show');
}

function closeReview() {
  document.getElementById('review-overlay').classList.remove('show');
}
function workerDayPay(w, halfDay) {
  if (halfDay && w.name.trim().toLowerCase() === 'divad ramos') {
    return 100;
  }

  return Number(w.wage || 0) * (halfDay ? 0.5 : 1);
}

function renderReviewRows() {
  const body = document.getElementById('review-body');

  body.innerHTML = [...selected].map(id => {
    const w = workers.find(x => x._id === id);
    if (!w) return '';

    const d = reviewDetails.get(id) || { halfDay: false, note: '' };
    const pay = workerDayPay(w, d.halfDay);

    return `
      <div class="rw-row">
        <div class="rw-top">
          <div class="rw-name">${esc(w.name)}</div>
          <div class="rw-pay">${money(pay)}</div>
        </div>
        <div class="daytype">
          <button type="button" class="${d.halfDay ? '' : 'on'}"
                  onclick="setDayType('${id}', false)">Full day — ${money(w.wage)}</button>
          <button type="button" class="${d.halfDay ? 'on' : ''}"
                  onclick="setDayType('${id}', true)">Half day — ${money(Number(w.wage || 0) / 2)}${money(workerDayPay(w, true))}
        <input class="rw-note" type="text" placeholder="Comment for ${esc(w.name)} (optional)"
               value="${esc(d.note)}"
               oninput="setWorkerNote('${id}', this.value)">
      </div>
    `;
  }).join('');

  updateReviewTotal();
}

function setDayType(id, halfDay) {
  const d = reviewDetails.get(id) || { halfDay: false, note: '' };
  d.halfDay = halfDay;
  reviewDetails.set(id, d);
  renderReviewRows();
}

// Kept off renderReviewRows so typing doesn't rebuild the field and drop focus.
function setWorkerNote(id, value) {
  const d = reviewDetails.get(id) || { halfDay: false, note: '' };
  d.note = value;
  reviewDetails.set(id, d);
}

function updateReviewTotal() {
  const total = [...selected].reduce((sum, id) => {
    const w = workers.find(x => x._id === id);
    if (!w) return sum;
    const d = reviewDetails.get(id) || { halfDay: false };
    return sum + workerDayPay(w, d.halfDay);
  }, 0);

  document.getElementById('review-total').textContent = money(total);
}

async function confirmSubmit() {
  const btn  = document.getElementById('review-confirm');
  const loc  = document.getElementById('att-location').value.trim();
  const note = document.getElementById('att-note').value.trim();
  const date = document.getElementById('att-date').value || todayStr();

  // Re-checked here because the dialog can sit open across midnight.
  if (date > todayStr()) {
    closeReview();
    return toast("You can't log work for a day that hasn't happened yet.");
  }

  const entries = [...selected].map(id => {
    const d = reviewDetails.get(id) || { halfDay: false, note: '' };
    return { workerId: id, halfDay: Boolean(d.halfDay), note: (d.note || '').trim() };
  });

  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const saved = await POST('/api/records', {
      date, location: loc, note, workerIds: [...selected], entries
    });

    records = records.filter(r => r._id !== saved._id);
    records.push(saved);

    const halfCount = entries.filter(e => e.halfDay).length;
    toast(
      `✓ Saved ${selected.size} ${selected.size === 1 ? 'person' : 'people'} for ` +
      `${formatDate(date)}${halfCount ? ` (${halfCount} half day${halfCount > 1 ? 's' : ''})` : ''}.`,
      true
    );

    closeReview();
    document.getElementById('att-location').value = '';
    document.getElementById('att-note').value = '';
    selectNone();
    refreshExistingBanner();
    populateFilters();
    renderView();
  } catch (e) {
    toast('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit';
  }
}

// ═══════════════════════════════════════
// HOURLY ENTRIES
// ═══════════════════════════════════════
let hourlyEntries = [];

function buildHourlyWorkerSelect() {
  const sel = document.getElementById('hourly-worker');
  if (!sel) return;

  const val = sel.value;
  sel.innerHTML = '<option value="">Select worker...</option>';

  workers
    .filter(w => w.payType === 'hourly' || w.payType === 'both')
    .forEach(w => {
      const rate = Number(w.hourlyRate || 0);
      const o = document.createElement('option');
      o.value = w._id;
      o.textContent = `${w.name} — $${rate}/hr`;
      sel.appendChild(o);
    });

  if (val) sel.value = val;
}

function calculateHours(timeIn, timeOut) {
  const [inHour, inMin] = timeIn.split(':').map(Number);
  const [outHour, outMin] = timeOut.split(':').map(Number);

  let startMinutes = inHour * 60 + inMin;
  let endMinutes = outHour * 60 + outMin;

  // Handles overnight shifts
  if (endMinutes < startMinutes) {
    endMinutes += 24 * 60;
  }

  const totalMinutes = endMinutes - startMinutes;
  return Math.round((totalMinutes / 60) * 100) / 100;
}


async function submitHourlyEntry() {
  const workerId = document.getElementById('hourly-worker').value;
  const date     = document.getElementById('hourly-date').value;
  const location = document.getElementById('hourly-location').value.trim();
  const timeIn   = document.getElementById('hourly-time-in').value;
  const timeOut  = document.getElementById('hourly-time-out').value;

  if (!workerId) return toast('Select a worker.');
  if (!date)     return toast('Enter a date.');
  if (!location) return toast('Enter a job site or description.');
  if (!timeIn)   return toast('Enter time in.');
  if (!timeOut)  return toast('Enter time out.');

  if (date > todayStr()) {
    return toast("You can't log hours for a day that hasn't happened yet.");
  }

  const worker = workers.find(w => w._id === workerId);
  const rate = Number(worker?.hourlyRate || 0);

  if (!worker || rate <= 0) {
    return toast('This worker does not have an hourly rate set.');
  }

  const hours = calculateHours(timeIn, timeOut);

  if (hours <= 0) {
    return toast('Invalid time range.');
  }

  try {
    const entry = await POST('/api/hourly', {
      workerId,
      date,
      location,
      timeIn,
      timeOut,
      hours,
      rate
    });

    hourlyEntries.push(entry);

    document.getElementById('hourly-worker').value = '';
    document.getElementById('hourly-date').value = '';
    document.getElementById('hourly-location').value = '';
    document.getElementById('hourly-time-in').value = '';
    document.getElementById('hourly-time-out').value = '';

    populateFilters();
    renderView();

    toast(`✓ Hourly entry added: ${hours} hours`, true);
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

async function deleteHourlyEntry(id) {
  if (!confirm('Remove this hourly entry?')) return;
  try {
    await DELETE('/api/hourly/' + id);
    hourlyEntries = hourlyEntries.filter(e => e._id !== id);
    renderView();
    toast('Entry removed.');
  } catch (e) { toast('Error: ' + e.message); }
}

async function deleteWorkerFromRecord(recordId, workerId) {
  if (!confirm('Remove this worker from this date?')) return;

  try {
    await DELETE(`/api/records/${recordId}?workerId=${workerId}`);

    records = records
      .map(r => {
        if (r._id !== recordId) return r;

        return {
          ...r,
          workerIds: r.workerIds.filter(id => id !== workerId),
          entries: (r.entries || []).filter(e => String(e.workerId) !== String(workerId))
        };
      })
      .filter(r => r.workerIds.length > 0);

    populateFilters();
    renderView();
    refreshExistingBanner();

    toast('Worker removed from this date.');
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

  
// ═══════════════════════════════════════
// VIEW PAGE
// ═══════════════════════════════════════
function populateFilters() {
  // Combine dates from both records and hourly entries for pay period list
  const allDates = [
    ...records.map(r => r.date),
    ...hourlyEntries.map(e => e.date)
  ];

  const periods = [...new Set(allDates.map(d => getPayPeriod(d).key))]
    .sort((a, b) => {
      const [, endA] = a.split('|');
      const [, endB] = b.split('|');
      return endB.localeCompare(endA);
    });

  const pSel = document.getElementById('filter-period');
  const pVal = pSel ? pSel.value : '';

  if (pSel) {
    pSel.innerHTML = '';

    periods.forEach(p => {
      const [, end] = p.split('|');
      const isCompleted = end < todayStr();

      const o = document.createElement('option');
      o.value = p;
      o.textContent = `${payPeriodLabel(p)}${isCompleted ? '' : ' (In Progress)'}`;
      pSel.appendChild(o);
    });

    const mostRecentCompletedPeriod = periods.find(p => {
      const [, end] = p.split('|');
      return end < todayStr();
    });

    const stillValidPeriod = periods.includes(pVal);

    if (stillValidPeriod) {
      pSel.value = pVal;
    } else if (mostRecentCompletedPeriod) {
      pSel.value = mostRecentCompletedPeriod;
    } else if (periods.length > 0) {
      pSel.value = periods[0];
    }
  }

  const wSel = document.getElementById('filter-worker');
  const wVal = wSel ? wSel.value : '';
  if (wSel) {
    wSel.innerHTML = '<option value="">All Workers</option>';
    workers.forEach(w => {
      const o = document.createElement('option');
      o.value = w._id;
      o.textContent = w.name;
      wSel.appendChild(o);
    });
    if (wVal) wSel.value = wVal;
  }

  buildHourlyWorkerSelect();
}

function renderView() {
  const periodFilter = document.getElementById('filter-period') ? document.getElementById('filter-period').value : '';
  const wFilter      = document.getElementById('filter-worker')  ? document.getElementById('filter-worker').value  : '';
  const list         = document.getElementById('view-list');

  let filteredRecords = records;
  let filteredHourly  = hourlyEntries;

  if (periodFilter) {
    filteredRecords = filteredRecords.filter(r => recordInPeriod(r, periodFilter));
    filteredHourly  = filteredHourly.filter(e => recordInPeriod(e, periodFilter));
  }

  let displayWorkers = workers;
  if (wFilter) displayWorkers = workers.filter(w => w._id === wFilter);

  const cards = displayWorkers.map(w => {
    const dailyDays = filteredRecords
      .filter(r => r.workerIds.includes(w._id))
      .map(r => {
        // No entry means a record written before half-days existed: full day.
        const entry = (r.entries || []).find(e => String(e.workerId) === String(w._id));
        const halfDay = Boolean(entry && entry.halfDay);

        return {
          date: r.date,
          type: 'daily',
          location: r.location,
          note: [r.note, entry && entry.note].map(t => (t || '').trim()).filter(Boolean).join(' · '),
          amount: workerDayPay(w, halfDay),
          halfDay,
          _id: r._id
        };
      });

    const hourlyDays = filteredHourly
      .filter(e => e.workerId === w._id)
      .map(e => ({
        date: e.date,
        type: 'hourly',
        location: e.location || '',
        timeIn: e.timeIn || '',
        timeOut: e.timeOut || '',
        hours: Number(e.hours || 0),
        rate: Number(e.rate || 0),
        amount: Number(e.hours || 0) * Number(e.rate || 0),
        _id: e._id
      }));

    const allDays = [...dailyDays, ...hourlyDays].sort((a, b) => a.date.localeCompare(b.date));

    return { worker: w, days: allDays };
  }).filter(x => x.days.length > 0);

  if (cards.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="big">No records yet</div><p>Submit attendance or add hourly entries to see them here.</p></div>`;
    return;
  }

  list.innerHTML = cards.map(({ worker: w, days }) => {
    const totalEarned = days.reduce((sum, d) => sum + Number(d.amount || 0), 0);

    const daysHtml = days.map(d => {
      if (d.type === 'daily') {
  return `<div class="day-chip">
    ${formatDate(d.date)}${d.halfDay ? '<span class="half-badge">Half day</span>' : ''}
    <span class="loc">· ${esc(d.location)}${d.note ? ' · ' + esc(d.note) : ''} · <strong>$${Number(d.amount || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</strong></span>
    <span onclick="deleteWorkerFromRecord('${d._id}', '${w._id}')" style="cursor:pointer;color:var(--red);font-size:12px;margin-left:4px;" title="Remove">✕</span>
  </div>`;
}

      return `<div class="day-chip" style="border-color:#6b8f6e;">${formatDate(d.date)}<span class="loc">· ${d.location ? esc(d.location) + ' · ' : ''}${d.timeIn || ''}${d.timeOut ? '–' + d.timeOut : ''} · ${d.hours} hrs · <strong>$${Number(d.amount || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</strong></span> <span onclick="deleteHourlyEntry('${d._id}')" style="cursor:pointer;color:var(--red);font-size:12px;margin-left:4px;" title="Remove">✕</span></div>`;
    }).join('');

    return `
      <div class="worker-card">
        <div class="wc-header">
          <div class="wc-name">${esc(w.name)}</div>
          <div class="wc-days-count">${days.length} entr${days.length !== 1 ? 'ies' : 'y'}</div>
          <div class="wc-wage">Total $${totalEarned.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
          <button class="dl-btn" onclick="downloadXLSX('${w._id}', '${periodFilter}')">⬇ Download XLSX</button>
        </div>
        <div class="wc-days">${daysHtml}</div>
      </div>
    `;
  }).join('');
}

// ═══════════════════════════════════════
// XLSX EXPORT — server-side via ExcelJS
// ═══════════════════════════════════════
async function downloadXLSX(workerId, periodKey) {
  const w = workers.find(x => x._id === workerId);
  if (!w) return;

  const [periodStart, periodEnd] = periodKey ? periodKey.split('|') : ['', ''];

  const params = new URLSearchParams({ workerId });
  if (periodStart) params.set('periodStart', periodStart);
  if (periodEnd)   params.set('periodEnd',   periodEnd);

  toast('Generating timesheet...');
  try {
    const res = await fetch(`/api/export?${params}`);
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    function formatPaydayForFileName(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const yy = String(d.getFullYear()).slice(-2);
  return `${mm}.${dd}.${yy}`;
}

let payday = todayStr();

if (periodEnd) {
  payday = toYMD(addDays(parseLocalDate(periodEnd), 3));
}

const safeName = w.name
  .trim()
  .replace(/\s+/g, ' ')
  .replace(/[\\/:*?"<>|]/g, '')
  .toUpperCase();

a.href = url;
a.download = `${safeName} ${formatPaydayForFileName(payday)}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
    toast('⬇ Downloaded timesheet for ' + w.name, true);
  } catch (e) {
    toast('Error: ' + e.message);
    console.error(e);
  }
}
// ═══════════════════════════════════════
// MANAGE WORKERS
// ═══════════════════════════════════════
function renderWorkerList() {
  const ul = document.getElementById('worker-list');
  if (workers.length === 0) {
    ul.innerHTML = '<p style="color:var(--gray-text);font-size:14px;padding:16px 0;">No workers yet. Add one below.</p>';
    return;
  }
  ul.innerHTML = workers.map(w => `
    <div class="mw-row">
      <div class="mw-name-static">${esc(w.name)}</div>
      <div class="mw-wage-static">$${w.wage}/day</div>
      <input type="number" placeholder="New wage" id="wage-${w._id}" style="max-width:130px;" min="0" step="0.01">
      <button class="btn-sm" onclick="updateWage('${w._id}')">Update</button>
      <button class="btn-sm danger" onclick="removeWorker('${w._id}')">Remove</button>
    </div>
  `).join('');
}

async function updateWage(id) {
  const input = document.getElementById('wage-' + id);
  const val   = parseFloat(input.value);
  if (isNaN(val) || val < 0) return toast('Enter a valid wage.');
  try {
    const updated = await PATCH('/api/workers/' + id, { wage: val });
    workers = workers.map(w => w._id === id ? updated : w);
    renderWorkerList(); buildEmpGrid();
    toast('✓ Wage updated.', true);
  } catch (e) { toast('Error: ' + e.message); }
}

async function removeWorker(id) {
  const w = workers.find(x => x._id === id);
  if (!confirm(`Remove ${w?.name}? Their attendance history will remain.`)) return;
  try {
    await DELETE('/api/workers/' + id);
    workers = workers.filter(x => x._id !== id);
    renderWorkerList(); buildEmpGrid(); populateFilters();
    toast('Worker removed.');
  } catch (e) { toast('Error: ' + e.message); }
}

async function addWorker() {
  const name = document.getElementById('new-name').value.trim();
  const wage = parseFloat(document.getElementById('new-wage').value);
  if (!name)              return toast('Enter a name.');
  if (isNaN(wage) || wage < 0) return toast('Enter a valid daily wage.');
  try {
    const w = await POST('/api/workers', { name, wage });
    workers.push(w);
    document.getElementById('new-name').value = '';
    document.getElementById('new-wage').value = '';
    renderWorkerList(); buildEmpGrid(); populateFilters();
    toast('✓ ' + name + ' added.', true);
  } catch (e) { toast('Error: ' + e.message); }
}

// ═══════════════════════════════════════
// TOAST
// ═══════════════════════════════════════
let toastTimer;
function toast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = ok ? 'var(--green-dark)' : 'var(--red)';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ═══════════════════════════════════════
// KEYBOARD PIN SUPPORT
// ═══════════════════════════════════════
document.addEventListener('keydown', e => {
  if (!currentUser) {
    if (e.key >= '0' && e.key <= '9') pinPress(e.key);
    if (e.key === 'Backspace') pinDel();
    return;
  }

  if (e.key === 'Escape') closeReview();
});

// Tapping the dark area around the dialog backs out, the way people expect.
document.getElementById('review-overlay').addEventListener('click', e => {
  if (e.target.id === 'review-overlay') closeReview();
});
</script>
